<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - DecConnect</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.18);
        }

        .title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
            color: #0f172a;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .error-global {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            display: block;
        }

        .btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #64748b;
        }

        .footer-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
        .success-message {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        .field-error {
            color: #b91c1c;
            font-size: 13px;
            margin-top: 6px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1 class="title">Crear cuenta</h1>

        <p class="subtitle">Registra tu perfil profesional en DecConnect</p>

        <div th:if="${param.success}" class="success-message">
            Usuario creado con éxito
        </div>

        <div th:if="${error}" class="error-message" th:text="${error}">
        </div>

        <div th:if="${error}" class="error-global" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">

            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input type="text" id="firstName" th:field="*{firstName}" placeholder="Ingresa tu nombre">
                <span class="field-error"
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"></span>
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" id="lastName" th:field="*{lastName}" placeholder="Ingresa tu apellido">
                <span class="field-error"
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Ingresa tu correo">
                <span class="field-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Mínimo 6 caracteres">
                <span class="field-error"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>

            <button type="submit" class="btn">Registrarme</button>
        </form>

        <p class="footer-text">
            ¿Ya tienes cuenta? <a href="#">Inicia sesión</a>
        </p>
    </div>
</div>

</body>
</html>
