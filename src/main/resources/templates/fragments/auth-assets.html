<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<style th:fragment="css" th:inline="none">
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1117;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#2f81f7;--green:#3fb950;--cyan:#39c5cf;--danger:#f85149;
        --accent:#2f81f7;--accent2:#39c5cf}
    body[data-role="company"]{--accent:#3fb950;--accent2:#39c5cf}
    body{min-height:100vh;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);
        background:radial-gradient(circle at 20% 20%,rgba(47,129,247,.18),transparent 32%),radial-gradient(circle at 85% 80%,rgba(63,185,80,.12),transparent 28%),var(--bg);}
    .page{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
    .hero{position:relative;padding:55px 8%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-right:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
    .brand-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0969da,#39c5cf);display:grid;place-items:center;font-weight:900;box-shadow:0 0 30px rgba(47,129,247,.35)}
    .brand span{color:var(--cyan)}
    .hero-content{max-width:620px;margin:70px 0}
    .hero h1{font-size:clamp(40px,4.6vw,68px);line-height:1.04;letter-spacing:-2px;margin-bottom:24px}
    .hero h1 strong{color:var(--green);transition:color .4s}
    .hero-description{color:var(--muted);font-size:18px;line-height:1.7;max-width:540px}
    .swap{transition:opacity .25s,transform .25s}
    .swap.out{opacity:0;transform:translateY(8px)}
    .features{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
    .feature{border:1px solid var(--border);background:rgba(22,27,34,.7);border-radius:999px;padding:9px 14px;font-size:13px;color:#c9d1d9;transition:border-color .2s,transform .2s}
    .feature:hover{border-color:var(--accent);transform:translateY(-2px)}
    .feature::before{content:"✓";color:var(--green);font-weight:bold;margin-right:7px}
    .terminal{background:rgba(22,27,34,.85);border:1px solid rgba(88,166,255,.3);border-radius:14px;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
    .terminal-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:7px}
    .dot{width:9px;height:9px;border-radius:50%}
    .terminal-body{padding:18px;font-family:Consolas,monospace;font-size:13px;line-height:1.8;color:var(--muted);min-height:130px;white-space:pre-wrap}
    .terminal-body b{color:var(--green);font-weight:400}.terminal-body i{color:var(--blue);font-style:normal}
    .caret{display:inline-block;width:7px;height:14px;background:var(--cyan);vertical-align:middle;animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .tech-footer{color:#6e7681;font-size:12px}
    .form-side{padding:40px;display:flex;justify-content:center;align-items:center}
    .card{--mx:50%;--my:0%;position:relative;width:100%;max-width:490px;background:rgba(22,27,34,.92);border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:0 25px 70px rgba(0,0,0,.35);overflow:hidden}
    .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(88,166,255,.10),transparent 60%)}
    .card:hover::before{opacity:1}
    .card>*{position:relative}
    .card h2{font-size:30px;margin-bottom:8px}
    .subtitle{color:var(--muted);margin-bottom:22px}
    .tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0d1117;border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:26px}
    .tab{position:relative;z-index:1;background:none;border:0;color:var(--muted);padding:11px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:color .25s;border-radius:9px}
    .tab.active{color:#fff}
    .tab-indicator{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:linear-gradient(90deg,#1f6feb,var(--accent));transition:transform .35s cubic-bezier(.4,.2,.2,1),background .4s}
    body[data-role="company"] .tab-indicator{transform:translateX(100%);background:linear-gradient(90deg,#238636,var(--green))}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{margin-bottom:17px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#c9d1d9}
    .input-wrap{position:relative}
    input{width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:13px 44px 13px 14px;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.16)}
    input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px #0d1117 inset;caret-color:var(--text);transition:background-color 9999s}
    input::placeholder{color:#6e7681}
    .input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);background:none;border:0;font-size:16px;line-height:1;padding:4px}
    button.input-icon{cursor:pointer;transition:color .2s}button.input-icon:hover{color:var(--text)}
    .strength{display:flex;gap:5px;margin-top:9px}
    .strength span{flex:1;height:4px;border-radius:4px;background:var(--border);transition:background .3s}
    .strength-label{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
    .btn{width:100%;border:0;border-radius:10px;background:linear-gradient(90deg,#1f6feb,#2f81f7);color:#fff;padding:14px;font:700 15px inherit;font-family:inherit;cursor:pointer;transition:transform .25s,filter .25s;box-shadow:0 8px 25px rgba(31,111,235,.25)}
    body[data-role="company"] .btn{background:linear-gradient(90deg,#2ea043,#3fb950);color:#07120a;box-shadow:0 8px 24px rgba(63,185,80,.2)}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .btn.loading{pointer-events:none;opacity:.8}
    .btn.loading::after{content:"";display:inline-block;width:14px;height:14px;margin-left:10px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error,.success-message{padding:12px 14px;border-radius:10px;margin-bottom:18px;font-size:14px}
    .error{border:1px solid rgba(248,81,73,.35);background:rgba(248,81,73,.1);color:#ff7b72;animation:shake .4s}
    .success-message{color:#56d364;background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35)}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .field-error{color:#ff7b72;font-size:12px;display:block;margin-top:6px}
    .footer{text-align:center;margin-top:24px;color:var(--muted);font-size:14px}
    a{color:#58a6ff;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
    .links{margin-top:16px;text-align:center}
    [hidden]{display:none!important}
    .fade-in{animation:fade .35s ease}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(max-width:900px){.page{grid-template-columns:1fr}.hero{display:none}.form-side{padding:20px}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:25px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<script th:fragment="js" th:inline="none">
    (function () {
        const body = document.body;
        const form = document.querySelector('form[data-action-pro]');
        const tabs = document.querySelectorAll('.tab');
        const params = new URLSearchParams(location.search);
        const $$ = (s) => document.querySelectorAll(s);

        function setRole(role, animate) {
            body.dataset.role = role;
            tabs.forEach(t => { const on = t.dataset.role === role; t.classList.toggle('active', on); t.setAttribute('aria-selected', on); });
            if (form) form.action = role === 'company' ? form.dataset.actionCompany : form.dataset.actionPro;
            // campos exclusivos de cada rol (los deshabilitados no se envían)
            $$('[data-only]').forEach(el => {
                const show = el.dataset.only === role;
                el.hidden = !show;
                el.querySelectorAll('input').forEach(i => i.disabled = !show);
                if (show && animate) { el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in'); }
            });
            // textos que cambian según el rol
            $$('.swap[data-pro]').forEach(el => {
                const txt = el.dataset[role === 'company' ? 'company' : 'pro'];
                if (!animate) { el.innerHTML = txt; return; }
                el.classList.add('out');
                setTimeout(() => { el.innerHTML = txt; el.classList.remove('out'); }, 220);
            });
            try { localStorage.setItem('dc-role', role); } catch (e) {}
            typeTerminal(role);
        }

        tabs.forEach(t => t.addEventListener('click', () => setRole(t.dataset.role, true)));

        // Mostrar/ocultar contraseña
        $$('.toggle-pw').forEach(b => b.addEventListener('click', () => {
            const i = document.getElementById(b.dataset.target);
            const show = i.type === 'password';
            i.type = show ? 'text' : 'password';
            b.textContent = show ? '🙈' : '👁';
            b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        }));

        // Medidor de seguridad (solo en registro)
        const pw = document.getElementById('password'), bars = $$('.strength span'), lbl = document.querySelector('.strength-label');
        if (pw && bars.length) pw.addEventListener('input', () => {
            const v = pw.value;
            let s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s++;
            const colors = ['#f85149', '#d29922', '#58a6ff', '#3fb950'], names = ['Débil', 'Aceptable', 'Buena', 'Excelente'];
            bars.forEach((b, i) => b.style.background = i < s ? colors[s - 1] : '');
            lbl.textContent = v ? names[Math.max(s - 1, 0)] : '';
        });

        // Estado de carga al enviar
        if (form) form.addEventListener('submit', () => {
            const b = form.querySelector('.btn'); b.classList.add('loading'); b.firstChild.nodeValue = 'Procesando';
        });

        // Brillo que sigue al mouse
        const card = document.querySelector('.card');
        let ticking = false;
        if (card) card.addEventListener('mousemove', e => {
            if (ticking) return; ticking = true;
            requestAnimationFrame(() => {
                const r = card.getBoundingClientRect();
                card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
                card.style.setProperty('--my', (e.clientY - r.top) + 'px');
                ticking = false;
            });
        });

        // Terminal que se escribe sola
        const term = document.getElementById('term');
        let timer;
        function typeTerminal(role) {
            if (!term) return;
            clearInterval(timer);
            const lines = (role === 'company' ? term.dataset.company : term.dataset.pro).split('|');
            const text = lines.join('\n'); let n = 0;
            timer = setInterval(() => {
                n++;
                term.innerHTML = text.slice(0, n).replace(/\n/g, '<br>') + '<span class="caret"></span>';
                if (n >= text.length) clearInterval(timer);
            }, 18);
        }

        let saved = null; try { saved = localStorage.getItem('dc-role'); } catch (e) {}
        const initial = params.get('role') || (form && form.dataset.forceRole) || saved || 'pro';
        setRole(initial === 'company' ? 'company' : 'pro', false);
    })();

</script>
</body>
</html>
