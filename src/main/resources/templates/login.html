<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DecConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.18);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        .field-error {
            color: #b91c1c;
            font-size: 13px;
            display: block;
            margin-top: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #64748b;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Iniciar sesión</h1>

    <p class="subtitle">
        Accede a tu perfil profesional
    </p>

    <div th:if="${error}"
         class="error"
         th:text="${error}">
    </div>

    <form th:action="@{/login}"
          th:object="${loginRequest}"
          method="post">

        <div class="form-group">

            <label>Correo</label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="correo@ejemplo.com">

            <span class="field-error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}">
            </span>

        </div>

        <div class="form-group">

            <label>Contraseña</label>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Tu contraseña">

            <span class="field-error"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}">
            </span>

        </div>

        <button type="submit" class="btn">
            Iniciar sesión
        </button>

    </form>

    <p class="footer">
        ¿No tienes cuenta?
        <a th:href="@{/register}">
            Regístrate
        </a>
    </p>

</div>

</body>
</html>
