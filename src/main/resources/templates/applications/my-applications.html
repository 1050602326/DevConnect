<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis postulaciones | DevConnect</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/}">
        <div class="brand-icon">&lt;/&gt;</div>
        Dev<span>Connect</span>
    </a>
    <nav class="nav">
        <a th:href="@{/offers}">Ofertas</a>
        <a th:href="@{/profile}">Mi perfil</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="link-btn">Cerrar sesión</button>
        </form>
    </nav>
</header>

<main class="container">

    <div class="page-header">
        <h1>Mis postulaciones</h1>
        <p>Sigue el estado de las ofertas a las que te has postulado.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">

        <!-- Sin postulaciones -->
        <div th:if="${#lists.isEmpty(applications)}" class="empty">
            <div class="icon">📭</div>
            <p>Aún no te has postulado a ninguna oferta.</p>
            <a th:href="@{/offers}" class="btn btn-sm">Ver ofertas</a>
        </div>

        <!-- Con postulaciones -->
        <div th:unless="${#lists.isEmpty(applications)}" class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Oferta</th>
                    <th>Empresa</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td>
                        <a th:href="@{/offers/{id}(id=${app.jobOffer.id})}"
                           th:text="${app.jobOffer.title}">Título</a>
                    </td>
                    <td th:text="${app.jobOffer.company.name}">Empresa</td>
                    <td class="muted"
                        th:text="${#temporals.format(app.appliedAt, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td>
                            <span class="badge"
                                  th:classappend="${'status-' + #strings.toLowerCase(app.status)}"
                                  th:text="${app.status}">PENDIENTE</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

</body>
</html>
